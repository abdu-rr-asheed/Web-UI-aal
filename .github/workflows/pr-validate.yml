name: pr-validate

# Runs on pull requests AND on branch pushes. The push trigger is what makes the
# gate provable without opening a PR — the Phase 2 canary (a deliberately
# inaccessible component) is pushed to a branch and this workflow must fail on
# it. A gate that has only ever been observed passing is not evidence of
# anything (PRD §16.1 exit criteria).
on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.15.0'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Everything here fails in under a couple of minutes, so a
  # broken ARIA attribute or a contrast regression is reported before the
  # expensive browser matrix spins up.
  # ---------------------------------------------------------------------------
  static:
    name: Static analysis + tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # PRD §6.5.1 template a11y rules + §7.6 layer boundaries, and the
      # §10.5 focus/token guards.
      - name: ESLint + Stylelint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # TR-07. Rebuilds tokens from source and re-derives every contrast pair,
      # so a hand-edited generated stylesheet cannot smuggle a failing colour in.
      - name: Design tokens + contrast gate
        run: npm run tokens:validate

      # Proves the gate itself still fires (lint rules, layer boundaries,
      # contrast maths). See tools/lint-gate and tools/contrast-validator.
      - name: Quality-gate self-tests
        run: npm run test:tools

      - name: Assert generated token output is committed and current
        run: |
          if ! git diff --quiet -- libs/tokens/src/styles libs/tokens/src/lib/tokens.generated.ts; then
            echo "::error::Generated token output is stale. Run 'npm run tokens:build' and commit the result."
            git --no-pager diff --stat -- libs/tokens/src/styles libs/tokens/src/lib/tokens.generated.ts
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: contrast-report
          path: reports/contrast/
          retention-days: 90

  # ---------------------------------------------------------------------------
  unit:
    name: Unit + component a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # TR-01 (axe per state) and TR-05 (coverage floors).
      - name: Vitest + jest-axe
        run: npm run test:ci -- --coverage

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  # ---------------------------------------------------------------------------
  build:
    name: Build libraries (APF) + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Validates real Angular Package Format output. The dev loop maps @aal/*
      # to source for speed (ADR-0011), so this is the only place the published
      # artefact shape is actually checked.
      - name: Build @aal/* libraries
        run: npm run build

      - name: Build docs app (audit target)
        run: npx ng build docs

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-artifact@v5
        with:
          name: docs-dist
          path: dist/docs/browser/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The expensive half. Real browsers, because jsdom cannot evaluate contrast,
  # pseudo-element focus rings, real focus order or the accessibility tree
  # (see docs/reports/engine-divergences.md, D-003).
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E accessibility (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false # one engine's failure must not hide another's
      matrix:
        project: [a11y-chromium, a11y-firefox, a11y-webkit, keyboard]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # TR-04 (accessibility-tree assertions), TR-08 (cross-browser).
      # Firefox runs here even though it will not launch on the author's
      # Windows machine (D-002) — CI is currently the only Firefox coverage.
      - name: Run ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-${{ matrix.project }}
          path: reports/playwright/
          retention-days: 30

  # ---------------------------------------------------------------------------
  page-audits:
    name: Lighthouse + Pa11y
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: docs-dist
          path: dist/docs/browser

      # TR-06 — accessibility score >= 0.98 on every docs route.
      - name: Lighthouse CI
        run: npm run lighthouse

      # A SECOND, independent engine (HTML_CodeSniffer). Two engines let the
      # research measure engine disagreement empirically rather than only citing
      # the literature on it (PRD §19.5, RQ5).
      - name: Pa11y CI (independent engine)
        run: |
          mkdir -p reports/pa11y
          npm run serve:dist &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null || { echo "::error::static server never came up"; exit 1; }
          npx pa11y-ci --config .pa11yci.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: page-audit-reports
          path: |
            reports/lighthouse/
            reports/pa11y/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Single required status check. Branch protection points at this one job, so
  # adding a matrix entry above cannot silently escape the gate.
  # ---------------------------------------------------------------------------
  gate:
    name: Accessibility quality gate
    runs-on: ubuntu-latest
    if: always()
    needs: [static, unit, build, e2e, page-audits]
    steps:
      - name: Evaluate PRD §12.3 thresholds
        run: |
          echo "static:      ${{ needs.static.result }}"
          echo "unit:        ${{ needs.unit.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "e2e:         ${{ needs.e2e.result }}"
          echo "page-audits: ${{ needs.page-audits.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Accessibility quality gate FAILED (PRD §12.3). Zero critical and zero serious violations are required; Lighthouse accessibility must be >= 98; contrast must pass in every theme. Do not weaken the gate to merge — fix the component, or file a waiver in docs/waivers.md. Critical and serious violations can never be waived (PRD §12.4)."
            exit 1
          fi
          echo "Accessibility quality gate PASSED."
